      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#d8d8d2"/>
    </linearGradient>
  </defs>
  <rect width="920" height="560" rx="34" fill="#f7f7f4"/>
  <rect width="920" height="560" rx="34" fill="url(#grid)" opacity=".55"/>
  <path d="M624 0h296v560H498z" fill="#101010"/>
  <g fill="none" stroke="#101010" stroke-width="2">
