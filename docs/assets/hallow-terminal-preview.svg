<svg width="1400" height="780" viewBox="0 0 1400 780" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Hallow terminal preview</title>
  <desc id="desc">A terminal-style preview of the Hallow command line dashboard after install.</desc>
  <defs>
    <linearGradient id="termBg" x1="0" y1="0" x2="1400" y2="780" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050505"/>
      <stop offset="1" stop-color="#161616"/>
    </linearGradient>
    <style>
      .mono { font-family: "SFMono-Regular", "Cascadia Mono", Consolas, monospace; }
      .cursor { animation: blink 1s steps(2,end) infinite; }
      .line { animation: reveal 7s ease-in-out infinite; }
      .line2 { animation: reveal 7s ease-in-out infinite; animation-delay: .35s; }
      .line3 { animation: reveal 7s ease-in-out infinite; animation-delay: .7s; }
      .line4 { animation: reveal 7s ease-in-out infinite; animation-delay: 1.05s; }
      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
      @keyframes reveal { 0% { opacity: .1; } 12%,88% { opacity: 1; } 100% { opacity: .1; } }
    </style>
  </defs>
  <rect width="1400" height="780" rx="32" fill="#f5f5f5"/>
  <g opacity=".22" stroke="#0a0a0a">
    <path d="M0 80H1400M0 160H1400M0 240H1400M0 320H1400M0 400H1400M0 480H1400M0 560H1400M0 640H1400M0 720H1400"/>
    <path d="M80 0V780M160 0V780M240 0V780M320 0V780M400 0V780M480 0V780M560 0V780M640 0V780M720 0V780M800 0V780M880 0V780M960 0V780M1040 0V780M1120 0V780M1200 0V780M1280 0V780M1360 0V780"/>
  </g>
  <rect x="58" y="54" width="1284" height="674" rx="26" fill="url(#termBg)" stroke="#2c2c2c"/>
  <circle cx="96" cy="90" r="7" fill="#fff" opacity=".9"/>
  <circle cx="122" cy="90" r="7" fill="#fff" opacity=".55"/>
  <circle cx="148" cy="90" r="7" fill="#fff" opacity=".35"/>
  <text x="178" y="96" class="mono" fill="#aaa" font-size="15" font-weight="800">HALLOW TERMINAL</text>
  <g class="mono" fill="#fff" font-size="18">
    <text x="92" y="150">__    __   ______   __       __        ______   __       __</text>
    <text x="92" y="176">|  \  |  \ /      \ |  \     |  \      /      \ |  \  _  |  \</text>
    <text x="92" y="202">| $$  | $$|  $$$$$$\| $$     | $$     |  $$$$$$\| $$ / \ | $$</text>
    <text x="92" y="228">| $$__| $$| $$__| $$| $$     | $$     | $$  | $$| $$/  $\| $$</text>
    <text x="92" y="254"> \$$   \$$ \$$   \$$ \$$$$$$$$ \$$$$$$$$  \$$$$$$  \$$      \$$</text>
  </g>
  <line x1="92" y1="286" x2="1308" y2="286" stroke="#fff" stroke-opacity=".65"/>
  <g class="mono" font-size="17">
    <text x="142" y="334" fill="#fff">001111111100</text>
    <text x="142" y="360" fill="#fff">001/        \100</text>
    <text x="142" y="386" fill="#fff">01/ 111111   \10</text>
    <text x="142" y="412" fill="#fff">10|  11 11   |01</text>
    <text x="142" y="438" fill="#fff">10| 0_11_0   |01</text>
    <text x="142" y="464" fill="#fff">001\__11__/100</text>
    <text x="420" y="334" fill="#fff">Hallow Agent OS v0.1.0  ::  runtime online</text>
    <text x="420" y="360" fill="#aaa">session 20260520_114818  ::  local-first / private runtime</text>
    <text class="line" x="420" y="386" fill="#fff">readiness 100% strong  ::  checks 33/33</text>
    <text class="line2" x="420" y="412" fill="#fff">memory 213 item(s), 213 indexed</text>
    <text class="line3" x="420" y="438" fill="#fff">mcp 2 server(s), 8 registered tool(s)</text>
    <text class="line4" x="420" y="464" fill="#fff">models 15 provider(s), 6 route(s)</text>
  </g>
  <g class="mono" font-size="17" fill="#fff">
    <text x="92" y="528">RUNTIME CHECKS</text>
    <text x="118" y="560">readiness                100% strong</text>
    <text x="118" y="590">doctor                   33/33 passing</text>
    <text x="118" y="620">security                 hardened</text>
    <text x="92" y="670">$ hallow start</text>
    <rect class="cursor" x="242" y="650" width="12" height="24" fill="#fff"/>
  </g>
  <g class="mono" font-size="17" fill="#fff">
    <text x="720" y="528">NEXT COMMANDS</text>
    <text x="746" y="560">open                     http://127.0.0.1:4767/desktop</text>
    <text x="746" y="590">doctor                   hallow doctor</text>
