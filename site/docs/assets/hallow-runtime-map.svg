<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">Hallow local runtime map</title>
  <desc id="desc">A monochrome map showing Hallow as a local runtime connected to memory, tools, models, gateways, skills, and audits.</desc>
  <defs>
